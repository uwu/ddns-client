[package]
name = "ddns-client"
version = "0.2.0"
edition = "2021"
authors = ["xirreal"]

[[bin]]
name = "ddns-client"
path = "src/main.rs"

[dependencies]
flexi_logger = "0.31.2"
home = "0.5.9"
log = "0.4.27"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread"] }
